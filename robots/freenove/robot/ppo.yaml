# PPO architecture and ArduPilot-compatible training environment for Freenove Robot Dog.
# Generated by tools/robots/build_catalog.py from tools/robots/catalog.py.
# Network: 45 -> 512 -> 256 -> 128 -> 12, ELU: the MicroDuck network validated on a Pixhawk 6C.
# Read by tools/robots/train_velocity.py and tools/robots/nnm_env.py.
robot_id: freenove
network:
  actor_hidden:
  - 512
  - 256
  - 128
  critic_hidden:
  - 512
  - 256
  - 128
  activation: elu
  init_noise_std: 0.3
  obs_normalization: true
quantization:
  weights: int8_per_row
  qat: true
  activations: float32
ppo:
  num_envs: 2048
  num_steps_per_env: 24
  max_iterations: 2000
  learning_rate: 0.001
  schedule: adaptive
  desired_kl: 0.01
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  entropy_coef: 0.01
  value_loss_coef: 1.0
  num_learning_epochs: 5
  num_mini_batches: 4
  max_grad_norm: 1.0
env:
  policy_hz: 50
  loop_hz: 200
  gravity_source: ap_imu_filter
  att_tau: 0.5
  act_max: 2.0
  pwm_quantization: true
  command_ranges:
    vx:
    - -0.2
    - 0.2
    vy:
    - -0.1
    - 0.1
    wz:
    - -0.8
    - 0.8
  p_zero_command: 0.02
  p_no_lateral: 0.1
  episode_s: 20.0
  fall_tilt_deg: 60.0
  gyro_noise: 0.02
  accel_noise: 0.05
  obs_delay_steps_max: 1
  reward:
    track_lin_vel: 3.0
    track_ang_vel: 3.0
    upright: 1.0
    pose: 0.5
    action_rate: -0.1
    tracking_sigma: 0.005
    tracking_sigma_ang: 0.05
    tracking_filter_s: 0.25
    upright_std: 0.2236
    walking_threshold: 0.01
    pose_std_standing:
      .*hip_roll: 0.05
      .*hip_pitch: 0.1
      .*knee: 0.1
    pose_std_walking:
      .*hip_roll: 0.15
      .*hip_pitch: 0.4
      .*knee: 0.4
    alive: 1.0
    body_ang_vel: -0.05
    dof_pos_limits: -1.0
    self_collisions: -1.0
    air_time: 10.0
    air_time_mode: touchdown
    air_time_min_s: 0.15
    air_time_max_s: 0.45
    foot_clearance: -2.0
    foot_swing_height: -0.25
    swing_height_m: 0.015
    foot_slip: -0.1
    trot: 0.0
    footfall_sequence: 0.5
    alternation_min_air_s: 0.2
    alternation_min_height_frac: 0.5
    joint_vel: -0.001
    termination: -10.0
    no_progress: -5.0
    no_progress_min_cmd: 0.03
    three_stance: 4.0
    all_stance: -2.0
    under_stance: -4.0
    under_stance_feet: 2
    undesired_contacts: -3.0
    base_height: 2.0
    base_height_target_m: 0.1
    base_height_std_m: 0.01
    joint_torque: -0.05
  resample_s:
  - 3.0
  - 8.0
  p_single_axis: 0.8
  push:
    interval_s:
    - 4.0
    - 8.0
    vel_xy: 0.05
  curriculum:
    action_rate_stages:
    - - 0
      - -0.1
    - - 26400
      - -0.2
    - - 28800
      - -0.3
    - - 31200
      - -0.4
    standing_stages:
    - - 0
      - 0.02
    - - 12000
      - 0.05
    - - 18000
      - 0.1
    - - 24000
      - 0.15
    - - 36000
      - 0.2
    - - 48000
      - 0.25
  eval_modes:
    stand:
    - 0.0
    - 0.0
    - 0.0
    forward_0.15:
    - 0.15
    - 0.0
    - 0.0
    backward_0.15:
    - -0.15
    - 0.0
    - 0.0
    lateral_0.1:
    - 0.0
    - 0.1
    - 0.0
    turn_0.6:
    - 0.0
    - 0.0
    - 0.6
