# PPO architecture and ArduPilot-compatible training environment for Upkie (wheeled biped).
# Generated by tools/robots/build_catalog.py from tools/robots/catalog.py.
# Network: 27 -> 512 -> 256 -> 128 -> 6, ELU: the MicroDuck network validated on a Pixhawk 6C.
# Read by tools/robots/train_velocity.py and tools/robots/nnm_env.py.
robot_id: upkie
network:
  actor_hidden:
  - 512
  - 256
  - 128
  critic_hidden:
  - 512
  - 256
  - 128
  activation: elu
  init_noise_std: 1.0
  obs_normalization: true
quantization:
  weights: int8_per_row
  qat: true
  activations: float32
ppo:
  num_envs: 2048
  num_steps_per_env: 24
  max_iterations: 2000
  learning_rate: 0.001
  schedule: adaptive
  desired_kl: 0.01
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  entropy_coef: 0.01
  value_loss_coef: 1.0
  num_learning_epochs: 5
  num_mini_batches: 4
  max_grad_norm: 1.0
env:
  policy_hz: 50
  loop_hz: 200
  gravity_source: ap_imu_filter
  att_tau: 0.5
  act_max: 2.0
  pwm_quantization: true
  command_ranges:
    vx:
    - -0.8
    - 0.8
    vy:
    - 0.0
    - 0.0
    wz:
    - -1.5
    - 1.5
  p_zero_command: 0.2
  p_no_lateral: 0.3
  episode_s: 20.0
  fall_tilt_deg: 60.0
  gyro_noise: 0.02
  accel_noise: 0.05
  obs_delay_steps_max: 1
  reward:
    track_lin_vel: 2.0
    track_ang_vel: 2.0
    upright: 2.0
    pose: 1.0
    action_rate: -0.8
    tracking_sigma: 0.05
    tracking_sigma_ang: 0.25
