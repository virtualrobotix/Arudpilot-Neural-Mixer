# PPO architecture and ArduPilot-compatible training environment for Microban.
# Generated by tools/robots/build_catalog.py from tools/robots/catalog.py.
# Network: 63 -> 512 -> 256 -> 128 -> 18, ELU: the MicroDuck network validated on a Pixhawk 6C.
# Read by tools/robots/train_velocity.py and tools/robots/nnm_env.py.
robot_id: microban
network:
  actor_hidden:
  - 512
  - 256
  - 128
  critic_hidden:
  - 512
  - 256
  - 128
  activation: elu
  init_noise_std: 1.0
  obs_normalization: true
quantization:
  weights: int8_per_row
  qat: true
  activations: float32
ppo:
  num_envs: 2048
  num_steps_per_env: 24
  max_iterations: 2000
  learning_rate: 0.001
  schedule: adaptive
  desired_kl: 0.01
  gamma: 0.99
  lam: 0.95
  clip_param: 0.2
  entropy_coef: 0.01
  value_loss_coef: 1.0
  num_learning_epochs: 5
  num_mini_batches: 4
  max_grad_norm: 1.0
env:
  policy_hz: 50
  loop_hz: 200
  gravity_source: ap_imu_filter
  att_tau: 0.5
  act_max: 2.0
  pwm_quantization: true
  command_ranges:
    vx:
    - -0.3
    - 0.3
    vy:
    - -0.2
    - 0.2
    wz:
    - -1.0
    - 1.0
  p_zero_command: 0.02
  p_no_lateral: 0.3
  episode_s: 20.0
  fall_tilt_deg: 70.0
  gyro_noise: 0.02
  accel_noise: 0.05
  obs_delay_steps_max: 1
  reward:
    track_lin_vel: 2.0
    track_ang_vel: 2.0
    upright: 2.0
    pose: 1.0
    action_rate: -0.1
    tracking_sigma: 0.1
    tracking_sigma_ang: 0.5
    upright_std: 0.2236
    walking_threshold: 0.01
    pose_std_standing:
      .*hip_yaw.*: 0.1
      .*hip_roll.*: 0.05
      .*hip_pitch.*: 0.15
      .*knee.*: 0.15
      .*ankle.*: 0.1
      .*shoulder.*: 0.2
      .*elbow.*: 0.2
    pose_std_walking:
      .*hip_yaw.*: 0.3
      .*hip_roll.*: 0.05
      .*hip_pitch.*: 0.4
      .*knee.*: 0.4
      .*ankle.*: 0.25
      .*shoulder.*: 0.5
      .*elbow.*: 0.5
    alive: 0.0
    body_ang_vel: -0.05
    angular_momentum: -0.02
    dof_pos_limits: -1.0
    self_collisions: -1.0
    air_time: 3.0
    air_time_mode: in_range
    air_time_min_s: 0.125
    air_time_max_s: 0.3
    foot_clearance: -2.0
    foot_swing_height: -0.25
    swing_height_m: 0.03
    foot_slip: -0.1
    single_stance: 1.0
    foot_lift: 1.0
    foot_alternation: 0.3
    alternation_min_air_s: 0.1
    alternation_min_height_frac: 0.5
    foot_symmetry: -0.1
  resample_s:
  - 3.0
  - 8.0
  push:
    interval_s:
    - 3.0
    - 6.0
    vel_xy: 0.15
  curriculum:
    action_rate_stages:
    - - 0
      - -0.1
    - - 12000
      - -0.2
    - - 18000
      - -0.4
    - - 24000
      - -0.6
    - - 30000
      - -0.8
    - - 36000
      - -1.0
    standing_stages:
    - - 0
      - 0.02
    - - 12000
      - 0.05
    - - 18000
      - 0.1
    - - 24000
      - 0.15
    - - 36000
      - 0.2
    - - 48000
      - 0.25
